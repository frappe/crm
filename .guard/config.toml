strictness = 2
comment_types = ["logic", "syntax"]
auto_review = ["open", "push", "rebase"]
review_drafts = false
include_branches = ["develop"]
disabled_labels = ["conflicts", "skip-guard"]
exclude_authors = ["mergify[bot]", "dependabot[bot]", "github-actions[bot]"]
ignore_keywords = ["WIP", "[skip review]"]
ignore_patterns = [
	"yarn.lock",
	"**/yarn.lock",
	"crm/locale/*.po",
	"crm/locale/*.pot",
	"**/*.min.js",
	"**/*.min.css",
]
status_check = true
update_description = false

[sections.summary]
included = true
collapsible = true
default_open = false

[sections.issues_table]
included = false

[sections.diagram]
included = false
