name: Run CRM Server Tests
description: Execute pilot tests for the CRM app with optional coverage collection.
inputs:
    bench-path:
        description: Absolute path to the bench directory
        required: false
        default: "/home/runner/pilot/benches/frappe-bench"
    site:
        description: Bench site on which to run tests
        required: false
        default: "test_site"
    app:
        description: App to test
        required: false
        default: "crm"
    enable-coverage:
        description: When true, include coverage flag during test execution
        required: false
        default: "true"
    type:
        description: Bench command type environment variable
        required: false
        default: "server"
    ci-build-id:
        description: CI build identifier propagated to bench commands
        required: false
runs:
    using: composite
    steps:
        - name: Restore database snapshot and install app under test
          shell: bash
          working-directory: ${{ inputs.bench-path }}
          run: |
              export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
              # Fresh container DB every run: recreate the user, restore the
              # dependency-only dump, then install the app under test.
              db_name=$(python3 -c "import json; print(json.load(open('sites/${{ inputs.site }}/site_config.json'))['db_name'])")
              db_user=$(python3 -c "import json; c = json.load(open('sites/${{ inputs.site }}/site_config.json')); print(c.get('db_user') or c['db_name'])")
              db_password=$(python3 -c "import json; print(json.load(open('sites/${{ inputs.site }}/site_config.json'))['db_password'])")
              printf '[client]\nskip-ssl\n' > ~/.my.cnf
              mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS \`$db_name\`"
              mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "CREATE USER IF NOT EXISTS '${db_user}'@'%' IDENTIFIED BY '${db_password}'"
              mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "GRANT ALL PRIVILEGES ON \`$db_name\`.* TO '${db_user}'@'%'"
              gunzip -c "$HOME/db-snapshot/test_site.sql.gz" | mariadb --host 127.0.0.1 --port 3306 -u root -proot "$db_name"
              # The cached bench never contains this app, so every run installs
              # fresh PR code. Dependencies were installed during provisioning.
              pilot get-app "${GITHUB_WORKSPACE}" --branch "${GITHUB_SHA}" --skip-assets
              pilot install-app "${{ inputs.site }}" "${{ inputs.app }}"

        - name: Run Tests
          shell: bash
          working-directory: ${{ inputs.bench-path }}
          env:
              TYPE: ${{ inputs.type }}
              CI_BUILD_ID: ${{ inputs.ci-build-id }}
          run: |
              pilot frappe --site "${{ inputs.site }}" set-config allow_tests true
              if [ "${{ inputs.enable-coverage }}" = "true" ]; then
                  pilot frappe --site "${{ inputs.site }}" run-tests --app "${{ inputs.app }}" --coverage
              else
                  pilot frappe --site "${{ inputs.site }}" run-tests --app "${{ inputs.app }}"
              fi
