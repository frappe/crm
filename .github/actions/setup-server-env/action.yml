name: Setup Server Environment
description: Prepare Python, Node, caching, and bench prerequisites for CRM server tests.
inputs:
    python-version:
        description: Python version to install
        required: false
        default: "3.14"
    node-version:
        description: Node version to install
        required: false
        default: "24"
    type:
        description: Bench install type passed to install script
        required: false
        default: "server"
    install-erpnext:
        description: When "true", fetch and install erpnext alongside crm
        required: false
        default: "false"
    frappe-branch:
        description: Frappe (and erpnext) branch to install and test against
        required: false
        default: "develop"
runs:
    using: composite
    steps:
        - name: Setup Python
          uses: actions/setup-python@v6
          with:
              python-version: ${{ inputs.python-version }}

        - name: Check for valid Python & merge conflicts
          shell: bash
          run: |
              python -m compileall -f "${GITHUB_WORKSPACE}"
              if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
                  echo "Found merge conflicts"
                  exit 1
              fi

        - name: Setup Node
          uses: actions/setup-node@v6
          with:
              node-version: ${{ inputs.node-version }}
              check-latest: true

        - name: Install Yarn
          shell: bash
          run: npm install -g yarn

        - name: Add to hosts file
          shell: bash
          run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

        - name: Cache pip and uv
          uses: actions/cache@v4
          with:
              path: |
                  ~/.cache/pip
                  ~/.cache/uv
              key: ${{ runner.os }}-py-deps-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
              restore-keys: |
                  ${{ runner.os }}-py-deps-

        - name: Cache node modules
          uses: actions/cache@v4
          env:
              cache-name: cache-node-modules
          with:
              path: ~/.npm
              key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
              restore-keys: |
                  ${{ runner.os }}-build-${{ env.cache-name }}-
                  ${{ runner.os }}-build-
                  ${{ runner.os }}-

        - name: Get yarn cache directory path
          id: yarn-cache-dir-path
          shell: bash
          run: echo "dir=$(yarn cache dir)" >> "${GITHUB_OUTPUT}"

        - name: Cache yarn
          uses: actions/cache@v4
          with:
              path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
              key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
              restore-keys: |
                  ${{ runner.os }}-yarn-

        - name: Clone frappe
          shell: bash
          run: git clone https://github.com/frappe/frappe --branch "$(bash .github/helper/frappe_ref.sh "${{ inputs.frappe-branch }}")" --depth 1 ~/frappe

        # Keyed on schema files, not commits: frappe merges many times a day without touching them.
        - name: Database snapshot key
          id: snapshot-key
          shell: bash
          env:
              FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
              INSTALL_ERPNEXT: ${{ inputs.install-erpnext }}
          run: |
              frappe=$(git -C ~/frappe ls-tree -r HEAD | grep -E '\.json$|/hooks\.py$|patches\.txt$' | sha256sum | cut -c1-16)
              erpnext=none
              if [ "$INSTALL_ERPNEXT" = "true" ]; then
                  erpnext=$(bash .github/helper/frappe_ref.sh "$FRAPPE_BRANCH" erpnext)
              fi
              crm="${{ hashFiles('.github/helper/install.sh', '.github/helper/site_config.json', 'crm/**/*.json', 'crm/hooks.py', 'crm/install.py', 'crm/patches.txt', 'crm/mcp.py', 'crm/domain_enrichment/install.py', 'crm/fcrm/doctype/crm_dashboard/crm_dashboard.py', 'crm/fcrm/doctype/crm_products/crm_products.py', 'crm/fcrm/doctype/fcrm_settings/fcrm_settings.py') }}"
              echo "key=db-snapshot-$FRAPPE_BRANCH-$frappe-$erpnext-${crm:0:16}" >> "$GITHUB_OUTPUT"

        # Scheduled runs always install fresh, so install-time changes the key misses still get caught.
        - name: Restore database snapshot
          id: db-snapshot
          if: github.event_name != 'schedule'
          uses: actions/cache/restore@v4
          with:
              path: ~/db-snapshot
              key: ${{ steps.snapshot-key.outputs.key }}

        - name: Install system packages
          uses: ./.github/actions/apt-install
          with:
              packages: redis-server mariadb-client libmariadb-dev

        - name: Install bench dependencies
          shell: bash
          env:
              TYPE: ${{ inputs.type }}
              INSTALL_ERPNEXT: ${{ inputs.install-erpnext }}
              FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
          run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

        - name: Save database snapshot
          if: steps.db-snapshot.outputs.cache-hit != 'true'
          uses: actions/cache/save@v4
          with:
              path: ~/db-snapshot
              key: ${{ steps.snapshot-key.outputs.key }}
