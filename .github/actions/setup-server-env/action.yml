name: Setup Server Environment
description: Prepare Python, Node, caching, and bench prerequisites for CRM server tests.
inputs:
    node-version:
        description: Node version to install
        required: false
        default: "24"
    type:
        description: Bench install type passed to install script
        required: false
        default: "server"
    install-erpnext:
        description: When "true", fetch and install erpnext alongside crm
        required: false
        default: "false"
    frappe-branch:
        description: Frappe (and erpnext) branch to install and test against
        required: false
        default: "develop"
runs:
    using: composite
    steps:
        - name: Check for valid Python & merge conflicts
          shell: bash
          run: |
              python3 -m compileall -f "${GITHUB_WORKSPACE}"
              if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"; then
                  echo "Found merge conflicts"
                  exit 1
              fi

        - name: Setup Node
          uses: actions/setup-node@v6
          with:
              node-version: ${{ inputs.node-version }}

        - name: Add to hosts file
          shell: bash
          run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

        - name: Cache pip and uv
          uses: actions/cache@v4
          with:
              path: |
                  ~/.cache/pip
                  ~/.cache/uv
              key: ${{ runner.os }}-py-deps-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
              restore-keys: |
                  ${{ runner.os }}-py-deps-

        # Keyed on dependency schema, not commits: the app under test is
        # installed fresh every run, so its code never needs to invalidate this.
        # Stable key on purpose: dependency drift is detected after restore by
        # comparing each app's checkout against its remote, so schema churn in
        # frappe no longer forces a full reprovision.
        - name: Compute bench cache key
          id: bench-key
          shell: bash
          run: |
              echo "key=${{ runner.os }}-pilot-bench-crm-${{ inputs.frappe-branch }}-py3.14-extdb-erpnext-${{ inputs.install-erpnext }}" >> "$GITHUB_OUTPUT"

        - name: Restore Pilot bench
          id: bench-cache
          uses: actions/cache/restore@v4
          with:
              path: |
                  ~/pilot/benches
                  ~/pilot/databases
                  ~/.config/systemd/user
                  ~/db-snapshot
              key: ${{ steps.bench-key.outputs.key }}

        - name: Install bench dependencies
          shell: bash
          env:
              TYPE: ${{ inputs.type }}
              INSTALL_ERPNEXT: ${{ inputs.install-erpnext }}
              FRAPPE_BRANCH: ${{ inputs.frappe-branch }}
              PILOT_CACHE_HIT: ${{ steps.bench-cache.outputs.cache-hit }}
          run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh

        - name: Save Pilot bench
          if: steps.bench-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@v4
          with:
              path: |
                  ~/pilot/benches
                  ~/pilot/databases
                  ~/.config/systemd/user
                  ~/db-snapshot
              key: ${{ steps.bench-key.outputs.key }}
