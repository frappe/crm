name: Linters

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read

jobs:
    commits-and-pre-commit:
        name: Commits & Pre-commit
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONDONTWRITEBYTECODE: "1"

        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 200

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  check-latest: true

            # The lockfile rarely changes, so restoring node_modules beats a fresh yarn install.
            - name: Cache node_modules
              uses: actions/cache@v4
              with:
                  path: frontend/node_modules
                  key: node-modules-${{ runner.os }}-node24-${{ hashFiles('frontend/yarn.lock') }}
                  restore-keys: |
                      node-modules-${{ runner.os }}-node24-

            - name: Install commitlint
              if: github.event_name == 'pull_request'
              run: npm install --no-save @commitlint/cli @commitlint/config-conventional

            - name: Check commit titles
              if: github.event_name == 'pull_request'
              run: npx commitlint --verbose --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"

            - name: Install frontend dependencies
              if: success() || failure()
              run: cd frontend && yarn install

            - name: Run Pre-commit
              if: success() || failure()
              uses: pre-commit/action@v3.0.1
              with:
                  extra_args: --all-files

    semgrep:
        name: Semgrep Rules
        runs-on: ubuntu-latest
        timeout-minutes: 15

        env:
            PIP_DISABLE_PIP_VERSION_CHECK: "1"
            PYTHONDONTWRITEBYTECODE: "1"

        steps:
            - uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
                  cache: pip

            - name: Install Semgrep
              run: pip install --upgrade semgrep

            - name: Download Semgrep rules
              run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

            - name: Run Semgrep rules
              run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness
