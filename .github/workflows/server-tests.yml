name: Server

on:
    pull_request:
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.ts"
            - "**.vue"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
    # Seeds hotfix-lane caches; scheduled runs only ever run on develop.
    push:
        branches:
            - main-hotfix
            - version-15-hotfix
            - version-16-hotfix
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.ts"
            - "**.vue"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
    schedule:
        # Run everday at midnight UTC / 5:30 IST
        - cron: "0 0 * * *"
env:
    CRM_BRANCH: ${{ github.base_ref || github.ref_name }}

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    setup:
        name: Resolve frappe matrix
        runs-on: ubuntu-latest
        outputs:
            frappe-branches: ${{ steps.resolve.outputs.branches }}
        steps:
            - name: Resolve frappe branches from target branch
              id: resolve
              run: |
                  BASE="${{ github.base_ref || github.ref_name }}"
                  # develop tracks frappe develop; version-NN lanes pin their frappe; main ships 15 and 16.
                  case "$BASE" in
                      develop)     echo 'branches=["develop"]' ;;
                      version-15*) echo 'branches=["version-15"]' ;;
                      version-16*) echo 'branches=["version-16"]' ;;
                      *)           echo 'branches=["version-15","version-16"]' ;;
                  esac >> "$GITHUB_OUTPUT"

    test:
        name: Tests (frappe ${{ matrix.frappe-branch }})
        needs: setup
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                frappe-branch: ${{ fromJson(needs.setup.outputs.frappe-branches) }}

        steps:
            - name: Clone
              uses: actions/checkout@v6

            - name: Setup environment
              uses: ./.github/actions/setup-server-env
              with:
                  node-version: "24"
                  type: "server"
                  # erpnext: stable lanes only
                  install-erpnext: ${{ env.CRM_BRANCH != 'develop' }}
                  frappe-branch: ${{ matrix.frappe-branch }}

            # erpnext v16 creates its test data on import, so create it before the suite starts.
            - name: Warm up ERPNext test data
              if: env.CRM_BRANCH != 'develop' && matrix.frappe-branch == 'version-16'
              working-directory: /home/runner/frappe-bench
              run: |
                  bench --site test_site set-config allow_tests true
                  bench --site test_site run-tests --lightmode --module erpnext.tests.bootstrap_test_data

            - name: Run server tests
              uses: ./.github/actions/run-server-tests
              with:
                  bench-path: "/home/runner/pilot/benches/frappe-bench"
                  site: "test_site"
                  app: "crm"
                  enable-coverage: "true"
                  type: "server"
                  ci-build-id: ${{ github.run_id }}

            - name: Publish coverage
              if: github.base_ref == 'develop' || github.ref_name == 'develop'
              uses: ./.github/actions/publish-codecov
              with:
                  files: /home/runner/pilot/benches/frappe-bench/sites/coverage.xml
                  fail-ci-if-error: "false"
                  token: ${{ secrets.CODECOV_TOKEN }}
