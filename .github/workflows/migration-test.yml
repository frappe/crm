name: Migration

# Verifies that an existing site on the PR's base branch can `bench migrate`
# to the PR code. Catches broken patches / schema changes before release.

on:
    pull_request:
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    setup:
        name: Resolve frappe matrix
        runs-on: ubuntu-latest
        outputs:
            frappe-branches: ${{ steps.resolve.outputs.branches }}
        steps:
            - name: Resolve frappe branches from base branch
              id: resolve
              run: |
                  # develop tracks frappe develop; version-NN lanes pin their frappe; main ships 15 and 16.
                  case "${{ github.base_ref || github.ref_name }}" in
                      version-15|version-15-hotfix) echo 'branches=["version-15"]' ;;
                      version-16|version-16-hotfix) echo 'branches=["version-16"]' ;;
                      main|main-hotfix)             echo 'branches=["version-15","version-16"]' ;;
                      *)                            echo 'branches=["develop"]' ;;
                  esac >> "$GITHUB_OUTPUT"

    migrate:
        name: Upgrade base branch -> PR (frappe ${{ matrix.frappe-branch }})
        needs: setup
        runs-on: ubuntu-latest
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                frappe-branch: ${{ fromJson(needs.setup.outputs.frappe-branches) }}

        env:
            BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
            BENCH_PATH: /home/runner/pilot/benches/frappe-bench

        steps:
            - name: Checkout PR code
              uses: actions/checkout@v6
              with:
                  path: pr-crm

            - name: Resolve frappe branch for base
              id: frappe
              run: |
                  echo "branch=${{ matrix.frappe-branch }}" >> "$GITHUB_OUTPUT"

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            # Stable key on purpose: dependency drift is detected after restore
            # by comparing each app's checkout against its remote (see below),
            # so frappe schema churn no longer forces a full reprovision.
            - name: Compute bench cache key
              id: bench-key
              run: |
                  echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
                  echo "key=${{ runner.os }}-pilot-bench-crm-migrate-${{ steps.frappe.outputs.branch }}-py3.14" >> "$GITHUB_OUTPUT"

            - name: Restore Pilot bench
              id: bench-cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      ~/pilot/benches
                      ~/pilot/databases
                      ~/.config/systemd/user
                  key: ${{ steps.bench-key.outputs.key }}

            - name: Install system packages
              uses: ./pr-crm/.github/actions/apt-install
              with:
                  packages: libmariadb-dev

            - name: Setup Pilot bench
              env:
                  BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
              run: |
                  export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
                  printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
                  export XDG_RUNTIME_DIR="/run/user/$(id -u)"
                  curl -fsSL "https://raw.githubusercontent.com/frappe/pilot/develop/install.sh" | sh
                  if [ ! -d "$HOME/pilot/benches/frappe-bench" ]; then
                    pilot new frappe-bench --frappe-branch "${{ steps.frappe.outputs.branch }}"
                    pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
                  fi
                  pilot -b frappe-bench init --skip-frontend
                  export BENCH_PATH=/home/runner/pilot/benches/frappe-bench
                  uv pip install --python "$BENCH_PATH/env/bin/python" -e "$BENCH_PATH/apps/frappe[test]"
                  pilot get-app https://github.com/frappe/whatsapp --skip-assets
                  pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
                  curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
                    http://127.0.0.1:7000/api/v1/health
                  if [ "${{ steps.bench-cache.outputs.cache-hit }}" != 'true' ]; then
                    pilot new-site test_site --admin-password admin --apps frappe whatsapp --skip-assets
                    # Emails resolve CSS through assets.json; tests never load the built bundles.
                    mkdir -p sites/assets && echo '{}' > sites/assets/assets.json
                    systemctl --user stop pilot-mariadb.service
                  else
                    # Bring cached dependency code up to its remote. Code-only drift
                    # is a fast reset; schema/requirements drift also reinstalls.
                    # (The final migrate below covers any schema drift.)
                    drifted=""
                    refresh_app() {
                      local current remote_sha app_path="$BENCH_PATH/apps/$1"
                      current=$(git -C "$app_path" rev-parse HEAD)
                      remote_sha=$(git ls-remote "$(git -C "$app_path" remote get-url origin)" "$2" | cut -f1)
                      [ "$current" != "$remote_sha" ] || return 0
                      git -C "$app_path" fetch --depth 1 origin "$2"
                      if ! git -C "$app_path" diff --quiet HEAD FETCH_HEAD -- '*.json' 'hooks.py' 'patches.txt' '*requirements*.txt' 'pyproject.toml' 'setup.py' 'setup.cfg'; then
                        drifted=1
                      fi
                      git -C "$app_path" reset --quiet --hard FETCH_HEAD
                    }
                    refresh_app frappe "refs/heads/${{ steps.frappe.outputs.branch }}"
                    refresh_app whatsapp HEAD
                    if [ -n "$drifted" ]; then
                      uv pip install --python "$BENCH_PATH/env/bin/python" -e "$BENCH_PATH/apps/frappe[test]" -e "$BENCH_PATH/apps/whatsapp"
                    fi
                  fi

            - name: Save Pilot bench
              if: steps.bench-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: |
                      ~/pilot/benches
                      ~/pilot/databases
                      ~/.config/systemd/user
                  key: ${{ steps.bench-key.outputs.key }}

            - name: Install base CRM and migrate to PR code
              working-directory: /home/runner/pilot/benches/frappe-bench
              env:
                  BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
              run: |
                  export XDG_RUNTIME_DIR="/run/user/$(id -u)"
                  systemctl --user start pilot-mariadb.service
                  # Base code installs fresh every run; the cached bench never contains crm.
                  pilot get-app "https://github.com/frappe/crm" --branch "$BASE_BRANCH" --skip-assets
                  pilot install-app test_site crm
                  # Swap the installed (base branch) code for the PR code, keep the git dir.
                  rsync -a --delete --exclude=".git" "${GITHUB_WORKSPACE}/pr-crm/" apps/crm/
                  pilot setup requirements
                  pilot frappe --site test_site migrate
