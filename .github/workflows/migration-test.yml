name: Migration

# Verifies that an existing site on the PR's base branch can `bench migrate`
# to the PR code. Catches broken patches / schema changes before release.

on:
    pull_request:
        paths-ignore:
            - "**.css"
            - "**.js"
            - "**.md"
            - "**.html"
            - "**.csv"
            - "**.po"
            - "**.pot"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    setup:
        name: Resolve frappe matrix
        runs-on: ubuntu-latest
        outputs:
            frappe-branches: ${{ steps.resolve.outputs.branches }}
        steps:
            - name: Resolve frappe branches from base branch
              id: resolve
              run: |
                  # develop tracks frappe develop; version-NN lanes pin their frappe; main ships 15 and 16.
                  case "${{ github.base_ref || github.ref_name }}" in
                      version-15|version-15-hotfix) echo 'branches=["version-15"]' ;;
                      version-16|version-16-hotfix) echo 'branches=["version-16"]' ;;
                      main|main-hotfix)             echo 'branches=["version-15","version-16"]' ;;
                      *)                            echo 'branches=["develop"]' ;;
                  esac >> "$GITHUB_OUTPUT"

    migrate:
        name: Upgrade base branch -> PR (frappe ${{ matrix.frappe-branch }})
        needs: setup
        runs-on: frappe-arc
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                frappe-branch: ${{ fromJson(needs.setup.outputs.frappe-branches) }}

        services:
            mysql:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=2s --health-retries=3

        env:
            BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
            BENCH_PATH: /home/runner/frappe-bench
            BENCH_USE_UV: "1"

        steps:
            - name: Checkout PR code
              uses: actions/checkout@v6
              with:
                  path: pr-crm

            - name: Resolve frappe branch for base
              id: frappe
              run: |
                  echo "branch=$(bash pr-crm/.github/helper/frappe_ref.sh "${{ matrix.frappe-branch }}")" >> "$GITHUB_OUTPUT"

            - name: Setup Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.14"

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

