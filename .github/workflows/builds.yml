name: Build Container Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - version-15
      - version-16
    tags:
      - "*"

jobs:
  build:
    name: Build

    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout Entire Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Branch
        run: |
          # version-NN branches and their vNN.x.y release tags build their own line; the rest build main.
          case "$GITHUB_REF_NAME" in
            version-15|v15.*) BRANCH=version-15 FRAPPE_BRANCH=version-15 IMAGE_TAG=version-15 ;;
            version-16|v16.*) BRANCH=version-16 FRAPPE_BRANCH=version-16 IMAGE_TAG=version-16 ;;
            *)                BRANCH=main       FRAPPE_BRANCH=version-15 IMAGE_TAG=stable ;;
          esac
          export APPS_JSON='[{"url": "https://github.com/frappe/whatsapp","branch": "main"},{"url": "https://github.com/frappe/crm","branch": "'"$BRANCH"'"}]'
          echo "APPS_JSON_BASE64=$(echo $APPS_JSON | base64 -w 0)" >> $GITHUB_ENV
          echo "FRAPPE_BRANCH=$FRAPPE_BRANCH" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: builds

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          context: builds
          file: builds/images/layered/Containerfile
          tags: >
            ghcr.io/${{ github.repository }}:${{ github.ref_name }},
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          build-args: |
            "FRAPPE_BRANCH=${{ env.FRAPPE_BRANCH }}"
            "APPS_JSON_BASE64=${{ env.APPS_JSON_BASE64 }}"