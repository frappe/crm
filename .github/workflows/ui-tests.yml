name: UI Tests

# E2E (Playwright) suite. Heavy gate: runs on the hotfix staging lanes
# before promoting to their stable branch, plus on demand. Develop stays on the fast lane.
on:
  push:
    branches:
      - main-hotfix
      - version-15-hotfix
      - version-16-hotfix
  pull_request:
    branches:
      - main-hotfix
      - version-15-hotfix
      - version-16-hotfix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

